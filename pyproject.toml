[project]
name = "faye"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ofthewildfire", email = "103148299+ofthewildfire@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "docker>=7.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[project.scripts]
faye = "faye:main"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
